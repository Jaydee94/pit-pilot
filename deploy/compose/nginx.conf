# Compose-only nginx config: serves the SPA AND proxies the API on one origin.
# (The kustomize deployment uses frontend/nginx.conf + an Ingress instead.)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API + auth to the api service (full path preserved — no trailing slash
  # on proxy_pass — so the Go router sees /api/... and /auth/... unchanged).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /auth/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback for everything else.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
